services:
  - type: web
    name: five5-leaderboard
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT server:app
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: picks-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1