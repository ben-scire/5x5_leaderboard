services:
  - type: web
    name: 5x5-coach
    region: virginia  # Set desired region (US East). Recreate service to move regions.
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT server:app
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        value: REPLACE_ME_IN_DASHBOARD
    disk:
      name: picks-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1