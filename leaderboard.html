<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>5x5 Pick 'em Week 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="leaderboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Styles moved to external stylesheet: leaderboard.css -->
</head>
<body>
  <div class="app-frame">
  <div class="site-header">
.sp-blur{filter:blur(3px);pointer-events:none;}
    <div class="header-inner">
  <div class="site-title">5x5 Pick 'em Week 3</div>
  <div class="subtitle">Brought to you by Hank&amp;Jake Operations and TS^2G</div>
  <img src="SSG-white.png" alt="The Scire Scoring Group Logo" class="tsg-logo" onerror="this.removeAttribute('onerror');this.style.opacity='0';setTimeout(()=>{this.src='SSG-white.png';this.style.opacity='1';},300);" />
    </div>
  </div>
  <div class="header-divider"></div>
  <!-- removed live data fetch error text -->

  <!-- Leaderboard now primary focus -->
  <!-- Live leaderboard toggle removed per new requirements -->
  <div id="chartWrapper" class="chart-wrapper">
    <canvas id="leaderboardChart"></canvas>
    <div class="chart-legend" id="chartLegend">
      <div class="legend-chip"><span class="legend-swatch thu"></span><span>Thu</span></div>
      <div class="legend-chip"><span class="legend-swatch fri"></span><span>Fri</span></div>
      <div class="legend-chip"><span class="legend-swatch sat"></span><span>Sat</span></div>
      <div class="legend-chip"><span class="legend-swatch sun"></span><span>Sun</span></div>
  <div class="legend-chip"><span class="legend-swatch mon"></span><span>Mon</span></div>
    </div>
  </div>

  <!-- Day Toggle (moved here between leaderboard and scoreboard) -->
  <div id="dayToggleBar" class="day-toggle-bar"></div>

  <!-- Final Scoreboard -->
  <div id="gamesWrap">
    <div class="scoreboard-heading accented" id="scoresTitle">Scores</div>
    <div class="scroll-x">
      <table id="gamesTable"></table>
    </div>
  </div>

  <h2 class="accented" id="picksHeader" style="display:flex;align-items:center;gap:14px;">
    <span style="flex:1 1 auto;">User Picks</span>
    <button id="picksCollapseBtn" class="collapse-btn" aria-expanded="true" aria-controls="picksGroup">Hide Picks</button>
  </h2>
  <div class="picks-collapsible-group" id="picksGroup">
    <!-- Single table reused; toggle buttons above control day selection -->
    <div class="scroll-x picks-section">
      <table id="picksTable"></table>
    </div>
  </div>

  <!-- Auth & Dynamic Picks Submission Panel -->
  <section id="authSection" class="auth-section" style="margin-top:32px;">
    <h2 class="accented" style="display:flex;align-items:center;gap:12px;">Account / Picks
      <span id="authStatus" style="font-size:0.65em;font-weight:400;color:#888;">Not signed in</span>
    </h2>
    <div id="authForms" class="auth-forms" style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;">
      <form id="createAccountForm" class="mini-card" style="min-width:260px;">
        <h3>Create Account</h3>
        <label>Email<br><input type="email" name="email" required autocomplete="username"></label>
        <label>Password<br><input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        <button type="submit">Create</button>
        <div class="form-msg" data-role="msg"></div>
      </form>
      <form id="loginForm" class="mini-card" style="min-width:260px;">
        <h3>Login</h3>
        <label>Email<br><input type="email" name="email" required autocomplete="username"></label>
        <label>Password<br><input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit">Login</button>
        <div class="form-msg" data-role="msg"></div>
      </form>
      <div id="accountInfo" class="mini-card" style="display:none;min-width:240px;">
        <h3>Account</h3>
        <p id="accountEmail" style="margin:4px 0 8px;font-weight:600;"></p>
        <button id="logoutBtn" type="button">Logout</button>
        <div style="margin-top:12px;font-size:0.8em;color:#666;">Your token persists for 7 days or until logout.</div>
      </div>
    </div>
    <div id="dynamicPicksPanel" style="margin-top:28px;display:none;">
      <h3 style="margin:0 0 12px;">Your Daily Picks</h3>
      <div id="dayPickerButtons" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"></div>
      <form id="dayPicksForm" class="mini-card" style="max-width:720px;">
        <div id="dayPicksFields" style="display:grid;gap:10px;"></div>
        <div style="display:flex;align-items:center;gap:12px;margin-top:14px;">
          <button type="submit" id="savePicksBtn">Save Picks</button>
          <span id="saveStatus" style="font-size:0.8em;color:#888;"></span>
        </div>
      </form>
    </div>
  </section>

  <!-- What-If simulator removed for faster load -->
  </div><!-- /.app-frame -->
  <!-- MNF submission section removed (now fully locked and displayed via CSV) -->
  <!-- External scripts loaded at end for clarity (defer not required here) -->
  <script src="config.js"></script>
  <script src="schedule_init.js"></script>
  <script src="leaderboard.js"></script>
  <script src="picks_submit.js"></script>
  <script src="picks_auth_ui.js"></script>
  <!-- monday_submit.js removed -->
</body>
</html>
