<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>5x5 Pick 'em – New Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="leaderboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Styles moved to external stylesheet: leaderboard.css -->
</head>
<body>
  <div class="app-frame">
  <div class="site-header">
    <div class="header-inner">
  <div class="site-title">5x5 Pick 'em – New Week</div>
  <div class="subtitle">Coach H&amp;Jake Coaching Co. and TS^2G</div>
  <img src="SSG-white.png" alt="The Scire Scoring Group Logo" class="tsg-logo" onerror="this.removeAttribute('onerror');this.style.opacity='0';setTimeout(()=>{this.src='SSG-white.png';this.style.opacity='1';},300);" />
    </div>
  </div>
  <div class="header-divider"></div>
  <div style="padding:8px 12px;font-size:13px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;">
    <a href="submit_thurs.html" style="color:#ffb74d;font-weight:600;">Submit This Week's Thursday Picks ➜</a>
    <span style="background:#1b3322;color:#66ffa6;padding:4px 10px;border-radius:4px;font-weight:600;">$50 Entry – Venmo @Hankrudden</span>
    <span style="font-size:12px;color:#888;">(If you still see old data, hard refresh with Ctrl+F5)</span>
  </div>
  <!-- removed live data fetch error text -->

  <!-- Leaderboard now primary focus -->
  <!-- Live leaderboard toggle removed per new requirements -->
  <div id="chartWrapper" class="chart-wrapper">
    <canvas id="leaderboardChart"></canvas>
    <div class="chart-legend" id="chartLegend">
      <div class="legend-chip"><span class="legend-swatch thu"></span><span>Thu</span></div>
      <div class="legend-chip"><span class="legend-swatch fri"></span><span>Fri</span></div>
      <div class="legend-chip"><span class="legend-swatch sat"></span><span>Sat</span></div>
      <div class="legend-chip"><span class="legend-swatch sun"></span><span>Sun</span></div>
  <div class="legend-chip"><span class="legend-swatch mon"></span><span>Mon</span></div>
    </div>
  </div>

  <!-- Day Toggle (moved here between leaderboard and scoreboard) -->
  <div id="dayToggleBar" class="day-toggle-bar"></div>

  <!-- Final Scoreboard -->
  <div id="gamesWrap">
    <div class="scoreboard-heading accented" id="scoresTitle">Scores</div>
    <div class="scroll-x">
      <table id="gamesTable"></table>
    </div>
  </div>

  <h2 class="accented" id="picksHeader" style="display:flex;align-items:center;gap:14px;">
    <span style="flex:1 1 auto;">User Picks</span>
    <button id="picksCollapseBtn" class="collapse-btn" aria-expanded="true" aria-controls="picksGroup">Hide Picks</button>
  </h2>
  <div class="picks-collapsible-group" id="picksGroup">
    <!-- Single table reused; toggle buttons above control day selection -->
    <div class="scroll-x picks-section">
      <table id="picksTable"></table>
    </div>
  </div>
  <!-- Removed Live Leaderboard (Per Day) section to reduce lag -->

  <!-- What-If simulator removed for faster load -->
  </div><!-- /.app-frame -->
  <!-- MNF submission section removed (now fully locked and displayed via CSV) -->
  <!-- External scripts loaded at end for clarity (defer not required here) -->
  <script src="config.js?v=NW1"></script>
  <!-- Load dynamic schedule mapper BEFORE legacy leaderboard.js so globals populate -->
  <script src="schedule_init.js?v=NW1"></script>
  <script src="leaderboard.js?v=NW1"></script>
  <!-- Dynamic live integration (backend-driven). Falls back silently if APIs missing -->
  <script src="leaderboard_live.js?v=NW1"></script>
  <!-- monday_submit.js removed -->
</body>
</html>
